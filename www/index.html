<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>崇德活動人力 ERP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>崇德活動人力 ERP</h1>
      <p class="subtitle">人員登錄・活動排班・當日到場復確</p>
    </div>
    <div class="header-actions">
      <button type="button" id="btnExport" class="btn btn-light">匯出備份</button>
      <label class="btn btn-light">
        匯入備份
        <input type="file" id="fileImport" accept=".json,application/json" hidden />
      </label>
    </div>
  </header>

  <nav class="tabs">
    <button type="button" class="tab-btn active" data-tab="activities">活動排班與復確</button>
    <button type="button" class="tab-btn" data-tab="members">人員登錄管理</button>
  </nav>

  <main class="container">
    <!-- 首頁活動人數未滿提醒警示 -->
    <section id="alertArea" class="alert-area"></section>

    <!-- 首頁活動人數提示卡片 -->
    <section id="summaryArea" class="summary-bar"></section>

    <!-- 工具列：搜尋與新增 -->
    <section class="toolbar">
      <input type="text" id="searchInput" placeholder="搜尋日期、活動名稱、工作內容、人員姓名或電話..." />
      <button type="button" id="btnAdd" class="btn btn-primary">+ 新增活動</button>
    </section>

    <!-- 主清單區 -->
    <section id="listArea"></section>
  </main>

  <!-- 新增 / 修改彈窗 -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">新增資料</h2>
        <button type="button" id="btnCloseModal" class="icon-btn">&times;</button>
      </div>
      <form id="mainForm" class="modal-body"></form>
      <div class="modal-footer">
        <button type="button" id="btnCancelModal" class="btn btn-light">取消</button>
        <button type="submit" form="mainForm" class="btn btn-primary">儲存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
